name: Plugin package

on:
  push:
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'provenance/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'provenance/**'
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and package plugin
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload plugin ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cue-ai-1.0.0
          path: |
            dist/cue-ai-1.0.0.zip
            dist/cue-ai-1.0.0.zip.sha256
          if-no-files-found: error
